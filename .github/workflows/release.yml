name: Release

on:
  push:
    tags: ['v*']        # e.g. v1.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # needed to create the GitHub Release

env:
  PROJECT: Gans.xcodeproj
  SCHEME: Gans
  APP_NAME: Gans

jobs:
  linux-deb:
    name: Build .deb (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install lintian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lintian

      - name: Build .deb
        # build-deb.sh reads VERSION from the environment (the tag is the source of truth).
        run: linux/packaging/build-deb.sh --output "$RUNNER_TEMP/deb" --no-lintian

      - name: lintian
        run: lintian --fail-on error --tag-display-limit 0 "$RUNNER_TEMP"/deb/gans_*_all.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: gans-deb
          path: ${{ runner.temp }}/deb/gans_*_all.deb
          if-no-files-found: error

  release:
    name: Build & publish (unsigned)
    runs-on: macos-14
    needs: linux-deb
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install tooling
        run: brew install xcbeautify create-dmg

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build (Release, no Developer ID signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Locate & ad-hoc sign the app
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name "$APP_NAME.app" -print -quit)
          [ -n "$APP" ] || { echo "::error::built $APP_NAME.app not found"; exit 1; }
          # Ad-hoc sign (identity "-"): no certificate, keychain, or API key required,
          # but it IS required for the app to launch on Apple Silicon. This is not a
          # Developer ID signature and the app is not notarized — Gatekeeper still warns.
          codesign --force --deep --sign - "$APP"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Package zip + DMG
        run: |
          ZIP="$RUNNER_TEMP/$APP_NAME-$VERSION.zip"
          DMG="$RUNNER_TEMP/$APP_NAME-$VERSION.dmg"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          # create-dmg can exit non-zero on a headless runner even on success — verify the file.
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 390 185 \
            "$DMG" "$APP_PATH" || true
          [ -f "$DMG" ] || { echo "::error::DMG was not created"; exit 1; }
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Download the Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: gans-deb
          path: ${{ runner.temp }}/deb

      - name: Locate the .deb
        run: |
          DEB=$(find "$RUNNER_TEMP/deb" -name 'gans_*_all.deb' -print -quit)
          [ -n "$DEB" ] || { echo "::error::Linux .deb artifact not found"; exit 1; }
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          files: |
            ${{ env.DMG }}
            ${{ env.ZIP }}
            ${{ env.DEB }}
          generate_release_notes: true
          body: |
            ### Unsigned build

            This app is **not** code-signed with a Developer ID or notarized, so macOS
            Gatekeeper will warn on first launch. To open it:

            - **Right-click** (or Control-click) the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine /Applications/${{ env.APP_NAME }}.app`

            Gans needs the **Accessibility** permission only to type/paste a code into
            another app; copying from the menu works without it.

            ### Linux (.deb)

            `sudo apt install ./gans_${{ env.VERSION }}_all.deb` (Ubuntu 22.04+ and other
            Debian-based distributions; dependencies resolve from the archive). On GNOME the
            AppIndicator extension must be enabled (preinstalled on Ubuntu). The Quick Search
            hotkey (Ctrl+Alt+Space) is registered as a GNOME custom shortcut, or falls back
            to an X11 key grab; codes are typed through X11 (XWayland) and copied to the
            clipboard otherwise. Details: [linux/README.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/linux/README.md).
