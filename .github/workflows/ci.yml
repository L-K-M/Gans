name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

# Cancel an in-progress run when a branch is pushed again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Gans.xcodeproj
  SCHEME: Gans

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # Finder's Get Info and the About panel show this string. It must agree
      # with LICENSE (Unlicense) in both build configurations of the app.
      - name: Check license statements
        run: |
          test "$(grep -cF 'INFOPLIST_KEY_NSHumanReadableCopyright = "Public domain (Unlicense). Bundled components keep their own licenses; see Third-Party-Notices.txt.";' "$PROJECT/project.pbxproj")" -eq 2 ||
            { echo "::error::NSHumanReadableCopyright must state the Unlicense in Debug and Release"; exit 1; }

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'   # pin so a runner-image bump can't change the toolchain

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | xcbeautify

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
